---
name: CI • Lint & Licenses

"on":
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:

jobs:
  linting:
    name: Run pre-commit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@v7

      - name: Run pre-commit (all files)
        run: |
          # Show diffs on failure and run across the entire repository to ensure consistency
          uvx pre-commit run --show-diff-on-failure --all-files

      - name: Show git status (debug)
        if: ${{ always() }}
        run: git status --porcelain || true
