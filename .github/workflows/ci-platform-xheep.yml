---
name: CI • XHEEP

"on":
  push:
    branches:
      - "**"
    tags:
      - "v*.*.*"
  pull_request:
  workflow_dispatch:
    inputs:
      docker_image_deeploy:
        description: "XHEEP Deeploy Docker Image to use"
        required: false
        default: "ghcr.io/pulp-platform/deeploy-xheep:devel"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  select-env:
    uses: ./.github/workflows/_select-env.yml
    with:
      docker_image_deeploy: ${{ github.event.inputs.docker_image_deeploy || 'ghcr.io/pulp-platform/deeploy-xheep:devel' }}

  xheep-kernels:
    needs: select-env
    uses: ./.github/workflows/_runner-xheep.yml
    with:
      runner: ${{ needs.select-env.outputs.runner }}
      docker-image: ${{ needs.select-env.outputs.image }}
      pytest-marker: "kernels"
